server:
  port: 19013
spring:
  application:
    name: problem-service
  main:
    allow-bean-definition-overriding: true
  datasource:
    driverClassName: com.mysql.cj.jdbc.Driver
    url: 'jdbc:mysql://localhost:3306/sduoj?useSSL=false'
    username: root
    password: root
  redis:
    host: localhost
    password: ""
    port: 6379
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB
  rabbitmq:
    host: localhost
    port: 5672
    username: admin
    password: admin
    publisher-confirms: true
    listener:
      simple:
        default-requeue-rejected: true
        retry:
          initial-interval: 3000
          enabled: true
          max-attempts: 3
mybatis-plus:
  type-aliases-package: cn.edu.sdu.qd.oj.**.entity

auth-service.ribbon.listOfServers: localhost:19010